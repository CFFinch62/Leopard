<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="55%" stop-color="#FFE9BE"/>
      <stop offset="100%" stop-color="#FFDD98"/>
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5B342"/>
      <stop offset="100%" stop-color="#E89A1E"/>
    </linearGradient>
    <linearGradient id="muzzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#FFEFD1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5A16"/>
      <stop offset="100%" stop-color="#5C3813"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#bannerBg)"/>
  <rect x="4" y="4" width="1192" height="292" rx="18" fill="none" stroke="#C97A12" stroke-width="3" opacity="0.35"/>

  <!-- scattered background rosettes for texture -->
  <g fill="none" stroke="#C97A12" stroke-width="3" opacity="0.18">
    <path d="M 420 40 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
    <path d="M 520 230 q 9 -5 15 4 q -3 9 -13 7 q -8 -4 -2 -11 Z"/>
    <path d="M 700 55 q 8 -6 14 3 q -2 9 -12 7 q -8 -3 -2 -10 Z"/>
    <path d="M 900 210 q 8 -6 14 3 q -2 9 -12 7 q -8 -3 -2 -10 Z"/>
    <path d="M 1050 70 q 9 -5 15 4 q -3 9 -13 7 q -8 -4 -2 -11 Z"/>
    <path d="M 620 130 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
    <path d="M 1120 190 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
    <path d="M 380 190 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
  </g>

  <!-- mascot icon, scaled and centered vertically at the left -->
  <g transform="translate(24,20) scale(0.867)">
    <circle cx="150" cy="150" r="148" fill="#FFF6E0" opacity="0.001"/>

    <!-- ears -->
    <path d="M 100 150 C 72 128 58 85 76 50 C 84 38 100 40 106 52 C 118 78 124 112 128 140 Z" fill="url(#furGrad)" stroke="#8A5A16" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 200 150 C 228 128 242 85 224 50 C 216 38 200 40 194 52 C 182 78 176 112 172 140 Z" fill="url(#furGrad)" stroke="#8A5A16" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 103 138 C 82 118 72 88 84 62 C 90 52 100 53 105 62 C 114 84 118 108 120 130 Z" fill="#FFEFD1"/>
    <path d="M 197 138 C 218 118 228 88 216 62 C 210 52 200 53 195 62 C 186 84 182 108 180 130 Z" fill="#FFEFD1"/>

    <!-- head -->
    <ellipse cx="150" cy="168" rx="92" ry="82" fill="url(#furGrad)" stroke="#8A5A16" stroke-width="4"/>

    <!-- muzzle -->
    <ellipse cx="150" cy="196" rx="52" ry="40" fill="url(#muzzleGrad)" stroke="#8A5A16" stroke-width="3"/>

    <!-- eyes -->
    <ellipse cx="120" cy="150" rx="14" ry="16" fill="#FFFFFF" stroke="#4A3010" stroke-width="2.5"/>
    <ellipse cx="180" cy="150" rx="14" ry="16" fill="#FFFFFF" stroke="#4A3010" stroke-width="2.5"/>
    <circle cx="122" cy="152" r="7.5" fill="#2E7D32"/>
    <circle cx="178" cy="152" r="7.5" fill="#2E7D32"/>
    <circle cx="122" cy="152" r="3" fill="#0D2E0F"/>
    <circle cx="178" cy="152" r="3" fill="#0D2E0F"/>
    <circle cx="125" cy="148" r="2" fill="#FFFFFF"/>
    <circle cx="181" cy="148" r="2" fill="#FFFFFF"/>

    <!-- nose -->
    <path d="M 138 186 Q 150 178 162 186 Q 156 198 150 200 Q 144 198 138 186 Z" fill="#3B2410"/>

    <!-- mouth -->
    <path d="M 150 200 Q 150 210 150 212" stroke="#4A3010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 150 212 Q 130 224 116 214" stroke="#4A3010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 150 212 Q 170 224 184 214" stroke="#4A3010" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- whiskers -->
    <g stroke="#8A5A16" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="98" y1="196" x2="60" y2="188"/>
      <line x1="98" y1="204" x2="58" y2="204"/>
      <line x1="98" y1="212" x2="62" y2="220"/>
      <line x1="202" y1="196" x2="240" y2="188"/>
      <line x1="202" y1="204" x2="242" y2="204"/>
      <line x1="202" y1="212" x2="238" y2="220"/>
    </g>

    <!-- leopard spots (rosettes) -->
    <g fill="none" stroke="#5C3813" stroke-width="4" stroke-linejoin="round">
      <path d="M 92 116 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z" fill="#5C3813" stroke="none"/>
      <path d="M 100 132 q 9 -5 15 4 q -3 9 -13 7 q -8 -4 -2 -11 Z"/>
      <path d="M 128 108 q 8 -6 14 3 q -2 9 -12 7 q -8 -3 -2 -10 Z"/>
      <path d="M 170 108 q 8 -6 14 3 q -2 9 -12 7 q -8 -3 -2 -10 Z"/>
      <path d="M 200 132 q 9 -5 15 4 q -3 9 -13 7 q -8 -4 -2 -11 Z"/>
      <path d="M 208 116 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z" fill="#5C3813" stroke="none"/>
      <path d="M 76 148 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
      <path d="M 224 148 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
      <path d="M 90 176 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
      <path d="M 210 176 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
      <path d="M 105 226 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
      <path d="M 195 226 q 8 -6 14 2 q -2 9 -12 8 q -8 -3 -2 -10 Z"/>
    </g>

    <g fill="#5C3813" opacity="0.85">
      <circle cx="112" cy="120" r="3.5"/>
      <circle cx="188" cy="120" r="3.5"/>
      <circle cx="80" cy="160" r="3"/>
      <circle cx="220" cy="160" r="3"/>
      <circle cx="140" cy="112" r="3"/>
      <circle cx="160" cy="112" r="3"/>
      <circle cx="118" cy="230" r="3"/>
      <circle cx="182" cy="230" r="3"/>
    </g>

    <g fill="#C97A12" opacity="0.7">
      <circle cx="122" cy="192" r="2.5"/>
      <circle cx="134" cy="210" r="2.5"/>
      <circle cx="178" cy="192" r="2.5"/>
      <circle cx="166" cy="210" r="2.5"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="300" y1="55" x2="300" y2="245" stroke="#C97A12" stroke-width="2" opacity="0.3"/>

  <!-- title and tagline -->
  <text x="336" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="url(#titleGrad)">Leopard</text>
  <text x="340" y="188" font-family="Verdana, Arial, sans-serif" font-size="21" fill="#6B4A1A">A friendly, beginner-first language for real desktop apps</text>
  <text x="340" y="216" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#8A6A3A" font-style="italic">windows &#183; controls &#183; menus &#183; turtle graphics &#183; sound</text>

  <!-- small paw-print style spot accent under title -->
  <g fill="#C97A12" opacity="0.55">
    <circle cx="340" cy="230" r="4"/>
    <circle cx="356" cy="234" r="3.2"/>
    <circle cx="372" cy="230" r="3.6"/>
    <circle cx="388" cy="235" r="3"/>
  </g>
</svg>
